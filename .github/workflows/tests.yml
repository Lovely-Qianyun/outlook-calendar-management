name: tests

# 离线单元测试 CI：三平台 × 两个 Python 版本。
# 全部 mock 网络，不碰真实账户；实机演练（drill.sh）仍需手动跑。
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      # 中文断言消息在 Windows 上按 locale 编码渲染会崩，固定 UTF-8
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --quiet pytest requests msal tzdata
      - name: Run unit tests
        run: python -m pytest tests/ -q
      - name: Compile check
        # compileall 自带递归，避免 Windows PowerShell 不展开 scripts/*.py 的 glob
        run: python -m compileall -q scripts
